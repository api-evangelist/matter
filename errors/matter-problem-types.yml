format: custom-json
rfc9457: false
envelope:
  shape: '{ "error": { "code": string, "message": string, "field": string|null } }'
  fields:
    code: Machine-readable error code for programmatic handling.
    message: Human-readable description.
    field: The request field that caused the error, when applicable (else null).
http_statuses:
  - {status: 200, meaning: OK, when: Successful read or update.}
  - {status: 201, meaning: Created, when: New resource created.}
  - {status: 204, meaning: No Content, when: Successful delete.}
  - {status: 400, meaning: Bad Request, when: Invalid body, missing field, or malformed parameter.}
  - {status: 401, meaning: Unauthorized, when: Missing or invalid API token.}
  - {status: 403, meaning: Forbidden, when: Valid token but no Pro subscription / not permitted.}
  - {status: 404, meaning: Not Found, when: Resource does not exist or is not owned by you.}
  - {status: 409, meaning: Conflict, when: Resource already exists (e.g. duplicate tag name).}
  - {status: 422, meaning: Unprocessable Entity, when: Well-formed but semantically invalid (e.g. bad URL).}
  - {status: 429, meaning: Too Many Requests, when: Rate limit exceeded (see Retry-After).}
  - {status: 500, meaning: Internal Server Error, when: Server-side error; retry with backoff.}
