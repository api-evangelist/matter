compatibility_promise: >-
  Within a version Matter makes no breaking changes: existing fields are not
  removed or renamed, endpoints are not removed, error codes do not change
  meaning, and response shapes are stable. Non-breaking additions (new optional
  fields, endpoints, query params, error codes) may ship within a version.
  Clients are advised to ignore unknown fields for forward compatibility.
