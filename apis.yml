name: Matter
description: >-
  Matter is a modern read-later application for people who take reading
  seriously — save articles, newsletters, podcasts, PDFs, and tweets from
  anywhere and read them in a clean, focused interface on iOS and the web, with
  highlighting, notes, tags, offline search, text-to-speech, and audio
  transcription of podcasts and videos. For Matter Pro subscribers, Matter ships
  a public REST API (api.getmatter.com/public/v1) to save, organize, search, and
  incrementally sync a reading library, secured with a personal Bearer token. It
  is complemented by a first-party CLI/TUI and official Obsidian, Roam, and
  Logseq highlight-export integrations. Matter is backed by GV (Google Ventures).
